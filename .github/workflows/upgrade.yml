name: Zkouška přechodu ze starší verze

# Stará vydaná verze (výchozí poslední ostrá) si vytvoří profil a cache, pak ji jako aktualizace z programu nahradí měřená verze.
# Na Windows se zkouší zip s přibalenou Javou. Nic nevydává, výsledek je v souhrnu běhu a v artefaktu s logy.
on:
  workflow_dispatch:
    inputs:
      stara:
        description: "Značka vydání, ze kterého se přechází (prázdné = poslední ostrá verze)"
        default: ""
      starsi:
        description: "Značka vydání starší řady (prázdné = poslední ostrá verze před řadou poslední ostré)"
        default: ""
  pull_request:
    branches: [main]
    paths:
      - ".github/skripty/test-upgradu.py"
      - ".github/skripty/upgrade-spust.sh"
      - ".github/workflows/upgrade.yml"

permissions:
  contents: read

jobs:
  upgrade:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Měřená verze
        shell: bash
        run: ./mvnw -B -q -DskipTests package

      - name: Přechod z poslední ostré verze
        shell: bash
        env:
          STARA: ${{ inputs.stara }}
          GH_TOKEN: ${{ github.token }}
        run: .github/skripty/upgrade-spust.sh prechod

      - name: Přechod s poškozenou cache dlaždic
        if: always()
        shell: bash
        env:
          STARA: ${{ inputs.stara }}
          GH_TOKEN: ${{ github.token }}
        run: .github/skripty/upgrade-spust.sh poskozena-cache

      - name: Přechod z poslední starší řady
        if: always()
        shell: bash
        env:
          STARSI: ${{ inputs.starsi }}
          GH_TOKEN: ${{ github.token }}
        run: .github/skripty/upgrade-spust.sh starsi-rada

      - name: Nová instalace s archivem tříd
        if: always()
        shell: bash
        run: .github/skripty/upgrade-spust.sh novy-zip

      - name: Logy
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upgrade-${{ runner.os }}
          path: |
            ${{ runner.temp }}/zkouska-*/GeoKuk/data/log/
            ${{ runner.temp }}/zkouska-*/GeoKuk/*.out
